<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Connection lines -->
  <line x1="24" y1="14" x2="12" y2="28" stroke="#475569" stroke-width="1" stroke-linecap="round"/>
  <line x1="24" y1="14" x2="36" y2="28" stroke="#475569" stroke-width="1" stroke-linecap="round"/>
  <line x1="24" y1="14" x2="24" y2="38" stroke="#475569" stroke-width="1" stroke-linecap="round"/>
  <line x1="12" y1="28" x2="24" y2="38" stroke="#475569" stroke-width="1" stroke-linecap="round"/>
  <line x1="36" y1="28" x2="24" y2="38" stroke="#475569" stroke-width="1" stroke-linecap="round"/>
  <line x1="12" y1="28" x2="36" y2="28" stroke="#475569" stroke-width="1" stroke-linecap="round"/>

  <!-- Directional indicators (small chevrons on connections) -->
  <polygon points="18,21 19.5,19.5 17,22" fill="#475569"/>
  <polygon points="30,21 28.5,19.5 31,22" fill="#475569"/>
  <polygon points="24,26 22.5,24.5 25.5,24.5" fill="#475569"/>

  <!-- Central orchestrator node (larger, cyan fill) -->
  <circle cx="24" cy="14" r="6" fill="#22d3ee" opacity="0.15"/>
  <circle cx="24" cy="14" r="6" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
  <circle cx="24" cy="14" r="3" fill="#22d3ee"/>

  <!-- Worker node (top-left) -->
  <circle cx="12" cy="28" r="4" fill="none" stroke="#a78bfa" stroke-width="1.2"/>
  <circle cx="12" cy="28" r="1.8" fill="#a78bfa"/>

  <!-- Tool node (top-right) -->
  <circle cx="36" cy="28" r="4" fill="none" stroke="#60a5fa" stroke-width="1.2"/>
  <circle cx="36" cy="28" r="1.8" fill="#60a5fa"/>

  <!-- Output node (bottom-center) -->
  <circle cx="24" cy="38" r="4" fill="none" stroke="#22d3ee" stroke-width="1.2"/>
  <circle cx="24" cy="38" r="1.8" fill="#22d3ee"/>
</svg>
