<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- Mark -->
  <g transform="translate(0, 0)">
    <!-- Connection lines -->
    <line x1="24" y1="14" x2="12" y2="28" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
    <line x1="24" y1="14" x2="36" y2="28" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
    <line x1="24" y1="14" x2="24" y2="38" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
    <line x1="12" y1="28" x2="24" y2="38" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
    <line x1="36" y1="28" x2="24" y2="38" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
    <line x1="12" y1="28" x2="36" y2="28" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>

    <!-- Directional indicators -->
    <polygon points="18,21 19.5,19.5 17,22" fill="#94a3b8"/>
    <polygon points="30,21 28.5,19.5 31,22" fill="#94a3b8"/>
    <polygon points="24,26 22.5,24.5 25.5,24.5" fill="#94a3b8"/>

    <!-- Central orchestrator node -->
    <circle cx="24" cy="14" r="6" fill="#22d3ee" opacity="0.15"/>
    <circle cx="24" cy="14" r="6" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
    <circle cx="24" cy="14" r="3" fill="#22d3ee"/>

    <!-- Worker node -->
    <circle cx="12" cy="28" r="4" fill="none" stroke="#a78bfa" stroke-width="1.2"/>
    <circle cx="12" cy="28" r="1.8" fill="#a78bfa"/>

    <!-- Tool node -->
    <circle cx="36" cy="28" r="4" fill="none" stroke="#60a5fa" stroke-width="1.2"/>
    <circle cx="36" cy="28" r="1.8" fill="#60a5fa"/>

    <!-- Output node -->
    <circle cx="24" cy="38" r="4" fill="none" stroke="#22d3ee" stroke-width="1.2"/>
    <circle cx="24" cy="38" r="1.8" fill="#22d3ee"/>
  </g>

  <!-- Wordmark (light variant: slate-800 + cyan) -->
  <text x="52" y="30" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="22" letter-spacing="-0.5">
    <tspan fill="#1e293b">Swarm</tspan><tspan fill="#22d3ee">Ops</tspan>
  </text>
</svg>
